<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La Avenida Chicharrón — Pedidos</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#7a1414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avenida App">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #171310;
    color: #f3e7d6;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
  }
  #app { width: 100%; max-width: 480px; min-height: 100vh; position: relative; }
  .display { font-family: 'Oswald', sans-serif; }
  button { cursor: pointer; border: none; font-family: inherit; }
  input { font-family: inherit; }

  header {
    background: linear-gradient(180deg, #1f1a15 0%, #171310 100%);
    border-bottom: 3px solid #7a1414;
    padding: 24px 20px 20px;
  }
  .header-top { display: flex; align-items: center; gap: 12px; }
  .pig {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-name { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; line-height: 1; }
  .brand-sub { color: #e8901f; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
  .hours {
    margin-left: auto; background: #2a2119; border-radius: 999px; padding: 6px 12px;
    display: flex; align-items: center; gap: 6px; font-size: 11px; color: #c9b8a0; white-space: nowrap;
  }
  .address { font-size: 13px; color: #8a7a67; margin-top: 10px; line-height: 1.5; }
  .fecha-hoy { font-size: 11.5px; color: #e8901f; font-weight: 600; margin-top: 8px; }

  .role-toggle { display: flex; background: #211a15; border-radius: 999px; padding: 4px; margin-top: 14px; }
  .role-toggle button { flex: 1; background: transparent; border-radius: 999px; padding: 9px 4px; font-size: 12.5px; font-weight: 700; color: #8a7a67; }
  .role-toggle button.active { background: #7a1414; color: #f3e7d6; }

  #downloadBtn {
    margin-top: 10px; width: 100%; background: transparent; border: 1px solid #3a2f26; border-radius: 10px; padding: 8px 0;
    display: flex; align-items: center; justify-content: center; gap: 6px; color: #c9b8a0; font-size: 11.5px; font-weight: 600;
  }

  .portada { display: flex; justify-content: center; padding: 22px 20px 4px; }
  .portada img { width: 100%; max-width: 260px; height: auto; display: block; }
  .section-title { padding: 20px 20px 4px; }
  .section-title h1 { font-size: 26px; font-weight: 700; }
  .section-title p { font-size: 13px; color: #8a7a67; margin-top: 2px; }

  #menuList { padding: 12px 20px 160px; display: flex; flex-direction: column; gap: 12px; }
  .item-card {
    background: #211a15; border: 1px solid #2c241d; border-radius: 14px; padding: 14px;
    display: flex; align-items: center; gap: 12px; transition: all 220ms ease;
  }
  .item-card.has-qty { border-color: #7a1414; }
  .item-emoji {
    background: #2a2119; border-radius: 12px; width: 56px; height: 56px; font-size: 26px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 15px; font-weight: 700; }
  .item-tag { font-size: 11px; color: #e8901f; font-weight: 600; margin-top: 1px; }
  .item-price { font-size: 13px; font-weight: 700; color: #c9b8a0; margin-top: 5px; }
  .item-price span { font-weight: 400; color: #6f6153; }

  .add-btn {
    background: #7a1414; color: #f3e7d6; border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600;
  }
  .qty-box { display: flex; align-items: center; gap: 8px; background: #2a2119; border-radius: 999px; padding: 4px; }
  .qty-box button {
    width: 26px; height: 26px; border-radius: 999px; background: #3a2f26; display: flex; align-items: center; justify-content: center; color: #f3e7d6; font-size: 14px;
  }
  .qty-box button.plus { background: #7a1414; }
  .qty-box span { width: 16px; text-align: center; font-size: 13px; font-weight: 700; }

  .footer-hint { padding: 8px 20px 24px; }
  .footer-hint-box {
    background: #211a15; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: #8a7a67; line-height: 1.5;
  }

  #cartBar { position: fixed; bottom: 0; left: 0; right: 0; display: none; justify-content: center; padding: 0 16px 16px; }
  #cartBar.show { display: flex; }
  #cartBarInner { width: 100%; max-width: 480px; }
  #cartBtn {
    background: #7a1414; border-radius: 16px; padding: 15px 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    width: 100%; display: flex; align-items: center; justify-content: space-between;
  }
  .cart-left { display: flex; align-items: center; gap: 8px; }
  .cart-count {
    background: #f3e7d6; color: #7a1414; width: 24px; height: 24px; border-radius: 999px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-label { color: #f3e7d6; font-weight: 600; font-size: 14px; }
  .cart-total { color: #f3e7d6; font-weight: 700; font-size: 15px; }

  #confirmScreen, #sentScreen { display: none; padding: 16px 20px 32px; }
  #confirmScreen.show, #sentScreen.show { display: block; }
  .back-btn { display: flex; align-items: center; gap: 6px; color: #8a7a67; font-size: 13px; margin-bottom: 16px; background: none; }
  #confirmScreen h2 { font-size: 22px; font-weight: 700; margin-bottom: 14px; }
  #cartItems { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .cart-item-row {
    background: #211a15; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  }
  .cart-item-left { display: flex; align-items: center; gap: 8px; }
  .cart-item-left .emoji { font-size: 18px; }
  .cart-item-name { font-size: 13px; font-weight: 600; }
  .cart-item-qty { font-size: 11px; color: #6f6153; }
  .cart-item-price { font-size: 13px; font-weight: 700; color: #c9b8a0; }

  .entrega-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .entrega-btn {
    flex: 1; border-radius: 12px; padding: 10px 0; background: #211a15; border: 1px solid #2c241d;
    display: flex; align-items: center; justify-content: center; gap: 6px; color: #f3e7d6; font-size: 13px; font-weight: 600;
  }
  .entrega-btn.active { background: #7a1414; border-color: #7a1414; }

  label.field-label { display:block; font-size:12px; font-weight:700; color:#c9b8a0; margin-bottom:6px; }
  .field-input {
    background: #211a15; border: 1px solid #2c241d; border-radius: 12px; padding: 12px 14px; color: #f3e7d6;
    font-size: 14px; width: 100%; margin-bottom: 16px; outline: none;
  }
  .field-input::placeholder { color: #6f6153; }

  .total-row {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    border-top: 1px solid #2c241d; padding-top: 14px;
  }
  .total-label { font-size: 14px; color: #8a7a67; }
  .total-value { font-size: 22px; font-weight: 700; color: #e8901f; }

  #sendBtn {
    background: #3a2f26; opacity: 0.6; border-radius: 14px; padding: 15px 0; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px; color: #0f1c14; font-weight: 700; font-size: 14px;
  }
  #sendBtn.ready { background: #25D366; opacity: 1; }

  #sentScreen { text-align: center; padding-top: 40px; }
  .check-circle {
    width: 68px; height: 68px; border-radius: 999px; background: #25D366; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
  }
  #sentScreen h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  #sentText { font-size: 13px; color: #8a7a67; line-height: 1.6; max-width: 300px; margin: 0 auto; }
  #resetBtn { margin-top: 26px; color: #e8901f; font-size: 13px; font-weight: 600; background: none; }

  /* ---------- tracking / owner / rider shared ---------- */
  #trackingScreen, #ownerScreen, #riderScreen { display: none; padding: 16px 20px 60px; }
  #trackingScreen.show, #ownerScreen.show, #riderScreen.show { display: block; }
  .empty { text-align: center; color: #6f6153; font-size: 13.5px; padding: 50px 10px; }

  .order-card { background: #211a15; border: 1px solid #2c241d; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
  .order-card .oid { font-size: 11px; color: #8a7a67; font-weight: 600; margin-bottom: 6px; }
  .order-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .badge { display:inline-block; font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
  .badge.recibido { background:#3a2f1a; color:#e8b23a; }
  .badge.preparando { background:#3a1f14; color:#e8901f; }
  .badge.listo { background:#1a3a24; color:#3ac97a; }
  .badge.en_camino { background:#1a2a3a; color:#4a9ae8; }
  .badge.entregado { background:#20301f; color:#7fbf6a; }
  .item-line { display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-top:1px solid #2c241d; }
  .item-line:first-of-type { border-top:none; }
  .m-cash { font-size:11.5px; color:#e8901f; font-weight:700; margin:8px 0; }
  .btn-block {
    display:block; width:100%; text-align:center; text-decoration:none; border-radius:12px; padding:12px 0;
    font-size:13.5px; font-weight:700; margin-top:8px; color:#f3e7d6;
  }
  .btn-block.orange { background:#e8901f; color:#171310; }
  .btn-block.wa { background:#25D366; color:#0f1c14; }
  .btn-block.wine { background:#7a1414; }
  .assign-row { display:flex; gap:8px; margin-top:8px; }
  .assign-row input { flex:1; }

  .role-tabs { display:flex; background:#211a15; border-radius:999px; padding:4px; margin-bottom:14px; }
  .role-tabs button { flex:1; background:transparent; border-radius:999px; padding:8px 4px; font-size:12px; font-weight:700; color:#8a7a67; }
  .role-tabs button.active { background:#7a1414; color:#f3e7d6; }
  .staff-actions { display:flex; justify-content:flex-end; gap:14px; margin-bottom:10px; }
  .staff-actions button { background:none; border:none; color:#6f6153; font-size:11px; font-weight:600; text-decoration:underline; }

  .new-order-flash { background:#e8901f; color:#171310; font-weight:800; text-align:center; padding:10px; border-radius:10px; margin-bottom:14px; animation:pulseFlash 1s ease-in-out infinite; }
  @keyframes pulseFlash{0%,100%{opacity:1;}50%{opacity:.55;}}

  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .stat-box { background:#211a15; border:1px solid #2c241d; border-radius:12px; padding:12px 8px; text-align:center; }
  .stat-box .num { font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; color:#e8901f; }
  .stat-box .lbl { font-size:9.5px; font-weight:700; color:#8a7a67; text-transform:uppercase; letter-spacing:.02em; margin-top:2px; }
  .filters-row { display:flex; gap:8px; margin-bottom:14px; }
  .filters-row select, .filters-row input { flex:1; background:#211a15; border:1px solid #2c241d; border-radius:10px; padding:9px 8px; font-size:12px; color:#f3e7d6; }
  .day-card { background:#211a15; border:1px solid #2c241d; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .day-card .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; }
  .day-card .head b { font-size:13px; }
  .day-card .head span { font-family:'Oswald',sans-serif; font-weight:700; color:#e8901f; font-size:14px; }
  .day-card .sub { font-size:10.5px; color:#6f6153; margin-bottom:6px; }

  .staff-name-box { background:#211a15; border:1px solid #2c241d; border-radius:12px; padding:14px; margin-bottom:14px; }
  .staff-name-box input { margin-bottom:10px; }
  .mini-map { height:160px; border-radius:10px; margin:6px 0 8px; background:#211a15; }
  .mini-map .leaflet-control-attribution { font-size:8px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-top">
      <div class="pig"><img src="icon-192.png" alt="La Avenida Chicharrón" style="width:100%;height:100%;object-fit:contain;"></div>
      <div>
        <div class="brand-name display">La Avenida</div>
        <div class="brand-sub">CHICHARRÓN</div>
      </div>
      <div class="hours">⏰ 9:00 AM – 7:00 PM</div>
    </div>
    <p class="address">Menú de domingos · Ave. Pedro A. Rivera, al lado de Induveca, La Vega</p>
    <p class="fecha-hoy" id="fechaHoy"></p>
    <div class="role-toggle">
      <button id="btnCliente" class="active" onclick="irACliente()">Cliente</button>
      <button id="btnDueno" onclick="tryEnterStaff('owner')">Dueño</button>
      <button id="btnRepartidor" onclick="tryEnterStaff('rider')">Repartidor</button>
    </div>
    <button id="downloadBtn" onclick="descargarApp()">📲 Instalar esta app</button>
  </header>

  <!-- ===================== CLIENTE: MENÚ ===================== -->
  <div id="menuScreen">
    <div class="portada">
      <img src="logo-portada.png" alt="La Avenida Chicharrón">
    </div>
    <div class="section-title">
      <h1 class="display">Haz tu pedido</h1>
      <p id="menuSubtitle">Sin llamar, sin esperar. Elige y confirma.</p>
    </div>
    <div class="role-tabs" style="margin:0 20px 4px;width:calc(100% - 40px);">
      <button class="active" id="catDomingo" onclick="setMenuCategoria('domingo')">🍖 Domingos</button>
      <button id="catSemana" onclick="setMenuCategoria('semana')">🍛 Entre semana</button>
    </div>
    <div id="menuList"></div>
    <div class="footer-hint" id="footerHint">
      <div class="footer-hint-box">🔥 Todos los domingos, de 9:00 AM a 7:00 PM. Delivery disponible.</div>
    </div>
  </div>

  <!-- ===================== CLIENTE: CARRITO ===================== -->
  <div id="confirmScreen">
    <button class="back-btn" onclick="goToMenu()">✕ Seguir viendo el menú</button>
    <h2 class="display">Tu pedido</h2>
    <div id="cartItems"></div>
    <div class="entrega-row">
      <button class="entrega-btn active" id="entregaDelivery" onclick="setEntrega('delivery')">🛵 Delivery</button>
      <button class="entrega-btn" id="entregaPickup" onclick="setEntrega('pickup')">📍 Recoger</button>
    </div>
    <label class="field-label">Tu nombre</label>
    <input class="field-input" id="nombreInput" placeholder="Ej: Yolanda Pérez" oninput="onFormChange()" />
    <label class="field-label">Tu WhatsApp</label>
    <input class="field-input" id="phoneInput" placeholder="Ej: 809-555-1234" oninput="onFormChange()" />
    <div id="addrBlock">
      <label class="field-label">Dirección de entrega</label>
      <input class="field-input" id="addrInput" placeholder="Ej: Calle Duarte #12" oninput="onFormChange()" />
      <div id="locStatus" style="margin:-8px 0 12px;font-size:11.5px;color:#8a7a67;"></div>
      <button type="button" class="btn-block" style="background:#3a2f26;margin-top:0;margin-bottom:16px;" onclick="shareLocation()">📍 Enviar mi ubicación exacta</button>
    </div>
    <label class="field-label">¿Cómo pagas?</label>
    <div class="entrega-row">
      <button class="entrega-btn active" id="payEfectivo" onclick="setPayMethod('efectivo')">💵 Efectivo</button>
      <button class="entrega-btn" id="payTransferencia" onclick="setPayMethod('transferencia')">🏦 Transferencia</button>
    </div>
    <div id="cashBlock">
      <label class="field-label">¿Con qué billete vas a pagar? (opcional, para tu vuelto)</label>
      <input class="field-input" id="pagaConInput" type="number" placeholder="Ej: 1000" />
    </div>
    <div id="transferBlock" style="display:none;">
      <div class="order-card" style="border-color:#e8901f;margin-bottom:16px;">
        <div style="font-size:12px;color:#c9b8a0;line-height:1.7;" id="datosTransferenciaBox"></div>
      </div>
      <label class="field-label">Número de confirmación o referencia (opcional)</label>
      <input class="field-input" id="referenciaInput" placeholder="Ej: los últimos 4 dígitos, o el número de confirmación" />
      <label class="field-label">Foto del comprobante (opcional, ayuda a validar tu pago más rápido)</label>
      <input class="field-input" id="comprobanteInput" type="file" accept="image/*" onchange="onComprobanteChange(event)" />
      <div id="comprobantePreview" style="margin:-8px 0 12px;"></div>
    </div>
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-value display" id="totalValue">RD$0</span>
    </div>
    <button id="sendBtn" onclick="sendOrder()">💬 Confirmar y enviar pedido</button>
  </div>

  <!-- ===================== CLIENTE: ENVIADO ===================== -->
  <div id="sentScreen">
    <div class="check-circle">✓</div>
    <h2 class="display">¡Pedido enviado!</h2>
    <p id="sentText"></p>
    <button id="resetBtn" onclick="setRole('cliente')">Ver mi pedido</button>
  </div>

  <!-- ===================== CLIENTE: SEGUIMIENTO ===================== -->
  <div id="trackingScreen"></div>

  <!-- ===================== DUEÑO ===================== -->
  <div id="ownerScreen"></div>

  <!-- ===================== REPARTIDOR ===================== -->
  <div id="riderScreen"></div>

  <div id="cartBar">
    <div id="cartBarInner">
      <button id="cartBtn" onclick="goToConfirm()">
        <div class="cart-left">
          <div class="cart-count" id="cartCount">0</div>
          <span class="cart-label">Ver pedido</span>
        </div>
        <span class="cart-total" id="cartBarTotal">RD$0</span>
      </button>
    </div>
  </div>

</div>

<script>
let MENU = [
  { id: "chicharron", nombre: "Chicharrón", tag: "El protagonista", precio: 350, unidad: "por libra", emoji: "🐷", activo:true, categoria:"domingo" },
  { id: "mofongo", nombre: "Mofongo", tag: "Hecho al momento", precio: 280, unidad: "por plato", emoji: "🍲", activo:true, categoria:"domingo" },
  { id: "orejitas", nombre: "Orejitas de cerdo", tag: "Especialidad de la casa", precio: 300, unidad: "por libra", emoji: "🍖", activo:true, categoria:"domingo" },
  { id: "ceviche", nombre: "Ceviche de chicharrón", tag: "Una explosión de sabor", precio: 320, unidad: "por plato", emoji: "🍋", activo:true, categoria:"domingo" },
  { id: "guacamole", nombre: "Guacamole", tag: "Fresco y delicioso", precio: 180, unidad: "por orden", emoji: "🥑", activo:true, categoria:"domingo" },
  { id: "locrio", nombre: "Locrio de chicharrón", tag: "El favorito de los domingos", precio: 300, unidad: "por plato", emoji: "🍚", activo:true, categoria:"domingo" },
  { id: "bebida", nombre: "Bebidas refrescantes", tag: "Bien frías", precio: 80, unidad: "c/u", emoji: "🥤", activo:true, categoria:"domingo" },
];

/* ---------- Conexión a Supabase ----------
   Proyecto de Supabase dedicado a esta app (Project URL + anon public key,
   Settings → API dentro del proyecto). La anon key es pública a propósito:
   el acceso real se controla con las políticas de la base de datos. */
const SUPABASE_URL = "https://geuzrauueykylcnhiimm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdldXpyYXV1ZXlreWxjbmhpaW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzM2NTgsImV4cCI6MjEwNDMwOTY1OH0.qUBcKxLQJJ7FXji4VSa6ByPXHt5ZWfUOfVDwSrvVsS4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// El Dueño entra con correo/contraseña real (Supabase Auth) — se
// administra desde el dashboard de Supabase (Authentication → Users).
// Los repartidores entran con su propio PIN (tabla "repartidores",
// editable desde la pestaña "Repartidores" del panel del Dueño).
let duenoAutenticado = false;
let notifPermiso = (typeof Notification!=='undefined') ? Notification.permission : 'unsupported';

// Cuentas bancarias que se le muestran al cliente cuando elige "Transferencia".
// Esto es solo el valor de arranque — el Dueño las edita desde la pestaña
// "Bancos" de su panel (nombre real, número real, etc.) sin tocar código.
let CUENTAS_TRANSFERENCIA = [

// Todo lo que viene de la base de datos (pedidos, menú, cuentas, repartidores)
// se trata como texto no confiable al insertarlo en el HTML: cualquiera con
// la anon key podría escribir ahí directo (sin pasar por esta app), así que
// nunca se confía en que ya venga "limpio".
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Para valores que van dentro de un onclick="...('valor')" — escapa tanto
// para que no rompa el string de JS como para que no rompa el atributo HTML.
function escJs(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Solo deja pasar links http/https reales — evita "javascript:" y similares
// en atributos href que vengan de datos (ej. comprobanteUrl).
function urlSegura(u){
  try{ const p = new URL(u, location.href); return (p.protocol==='http:'||p.protocol==='https:') ? p.href : '#'; }catch(e){ return '#'; }
}

// Sugiere una etiqueta según palabras clave en el nombre del plato — el
// dueño la puede editar o borrar, es solo un punto de partida.
function sugerirEtiqueta(nombre){
  const n = normalizarNombre(nombre);
  const reglas = [
    [/pollo/, '🐔 Con pollo'],
    [/res\b|carne/, '🥩 Con carne de res'],
    [/cerdo|chicharr|pernil|costilla/, '🐷 Con cerdo'],
    [/pescado|pez\b/, '🐟 Con pescado'],
    [/camaron|mariscos/, '🦐 Con mariscos'],
    [/arroz|locrio|moro/, '🍚 Con arroz'],
    [/habichuela|guandul/, '🫘 Con habichuelas'],
    [/mofongo|mangu|platano/, '🍌 Con plátano'],
    [/ensalada|vegetal|vegetarian/, '🥗 Vegetariano'],
    [/sopa|caldo|sancocho/, '🍲 Calientito'],
    [/jugo|bebida|refresco|morir sonando/, '🥤 Para acompañar'],
    [/postre|dulce|flan/, '🍮 Dulce'],
  ];
  for(const [regex, tag] of reglas){ if(regex.test(n)) return tag; }
  return '🍽️ Plato del día';
}
function sugerirEtiquetaAuto(){
  const tagInput = document.getElementById('nuevo_tag');
  if(!tagInput) return;
  if(tagInput.value.trim()==='' || tagInput.dataset.auto==='1'){
    tagInput.value = sugerirEtiqueta(document.getElementById('nuevo_nombre').value);
    tagInput.dataset.auto = '1';
  }
}

function rowToOrder(r){
  return {
    id: r.id, shortId: r.short_id, custName: r.cust_name, phone: r.phone,
    items: r.items || [], total: Number(r.total)||0, deliveryType: r.delivery_type,
    addr: r.addr || null,
    pagaCon: (r.paga_con===null || r.paga_con===undefined) ? null : Number(r.paga_con),
    status: r.status, rider: r.rider || null, createdAt: Number(r.created_at),
    messages: r.messages || [], payMethod: r.pay_method || 'efectivo',
    referencia: r.referencia || null, pagoConfirmado: r.pago_confirmado === true,
    location: (r.lat!==null && r.lat!==undefined && r.lng!==null && r.lng!==undefined) ? { lat:Number(r.lat), lng:Number(r.lng) } : null,
    comprobanteUrl: r.comprobante_url || null
  };
}
function orderToRow(o){
  return {
    id:o.id, short_id:o.shortId, cust_name:o.custName, phone:o.phone,
    items:o.items||[], total:o.total, delivery_type:o.deliveryType, addr:o.addr||null,
    paga_con: (o.pagaCon===null || o.pagaCon===undefined) ? null : o.pagaCon,
    status:o.status, rider:o.rider||null, created_at:o.createdAt,
    messages:o.messages||[], pay_method:o.payMethod||'efectivo', referencia:o.referencia||null,
    pago_confirmado: o.pagoConfirmado===true,
    lat: o.location ? o.location.lat : null, lng: o.location ? o.location.lng : null,
    comprobante_url: o.comprobanteUrl || null
  };
}
function rowToMenuItem(r){
  return { id:r.id, nombre:r.nombre, tag:r.tag||'', precio:Number(r.precio)||0, unidad:r.unidad||'', emoji:r.emoji||'', activo: r.activo !== false, categoria: r.categoria || 'domingo' };
}
function rowToCuenta(r){
  return { id:r.id, banco:r.banco, tipoCuenta:r.tipo_cuenta||'', numeroCuenta:String(r.numero_cuenta||''), titular:r.titular||'', cedula:r.cedula||'' };
}
function rowToRepartidor(r){
  return { id:r.id, nombre:r.nombre, pin:String(r.pin||''), activo: r.activo !== false };
}

async function fetchData(){
  try{
    const [op, mp, cp, rp] = await Promise.all([
      sb.from('pedidos').select('*').order('created_at', { ascending:true }),
      sb.from('menu').select('*'),
      sb.from('cuentas').select('*'),
      sb.from('repartidores').select('*')
    ]);
    if(op.error) console.error('No se pudieron leer los pedidos', op.error);
    if(mp.error) console.error('No se pudo leer el menú', mp.error);
    if(cp.error) console.error('No se pudieron leer las cuentas', cp.error);
    if(rp.error) console.error('No se pudieron leer los repartidores', rp.error);
    return {
      orders: (op.data||[]).map(rowToOrder),
      menu: (mp.data||[]).map(rowToMenuItem),
      cuentas: (cp.data||[]).map(rowToCuenta),
      repartidores: (rp.data||[]).map(rowToRepartidor)
    };
  }catch(e){ console.error('No se pudo conectar con Supabase', e); return {orders:[], menu:[], cuentas:[], repartidores:[]}; }
}

// Sube la foto del comprobante (viene como data URL base64) al bucket
// público "comprobantes" de Supabase Storage y devuelve el link directo.
async function subirComprobante(base64DataUrl, nombreArchivo){
  try{
    const res = await fetch(base64DataUrl);
    const blob = await res.blob();
    const { error } = await sb.storage.from('comprobantes').upload(nombreArchivo, blob, { contentType:'image/jpeg', upsert:true });
    if(error){ console.error('No se pudo subir el comprobante', error); return null; }
    const { data } = sb.storage.from('comprobantes').getPublicUrl(nombreArchivo);
    return data.publicUrl;
  }catch(e){ console.error('No se pudo subir el comprobante', e); return null; }
}
async function pushCreateOrder(order){
  let comprobanteUrl = null;
  if(order.comprobante){ comprobanteUrl = await subirComprobante(order.comprobante, 'comprobante_'+order.id+'.jpg'); }

  const { error } = await sb.from('pedidos').insert(row);
  if(error) console.error('No se pudo crear el pedido', error);

  const pin = prompt('PIN del repartidor:');
  if(pin===null) return;
  const data = await fetchData();
  const rep = (data.repartidores||[]).find(r=>r.pin===pin && r.activo!==false);
  if(!rep){ alert('PIN incorrecto.'); return; }
  riderName = rep.nombre;

  localStorage.setItem('avenida_repartidor_nombre', rep.nombre);
  setRole('rider');
}

  riderName='';

function claveDia(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function claveMes(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function capitalizar(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function nombreDia(k){ const [y,m,d]=k.split('-').map(Number); return capitalizar(new Date(y,m-1,d).toLocaleDateString('es-DO',{weekday:'long', day:'numeric', month:'long'})); }
function nombreMes(k){ const [y,m]=k.split('-').map(Number); return capitalizar(new Date(y,m-1,1).toLocaleDateString('es-DO',{month:'long', year:'numeric'})); }
function inicioSemana(fecha){ const d=new Date(fecha); d.setHours(0,0,0,0); const ds=d.getDay(); d.setDate(d.getDate()-((ds===0)?6:ds-1)); return d.getTime(); }

function vueltoFor(o){ if(!o.pagaCon) return null; return Math.max(0, o.pagaCon - o.total); }

// Redimensiona la foto a un ancho máximo razonable antes de enviarla —
// una foto de celular sin comprimir puede pesar varios MB, esto la deja
// en unos cientos de KB sin que se note la diferencia al verla.
function onComprobanteChange(e){
  const file = e.target.files[0];
  const preview = document.getElementById('comprobantePreview');
  if(!file){ comprobanteBase64 = null; preview.innerHTML=''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxAncho = 1000;
      const escala = Math.min(1, maxAncho / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * escala);
      canvas.height = Math.round(img.height * escala);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      comprobanteBase64 = canvas.toDataURL('image/jpeg', 0.72);
      preview.innerHTML = `<img src="${comprobanteBase64}" style="max-width:160px;border-radius:10px;border:1px solid #2c241d;display:block;">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function shareLocation(){
  const box = document.getElementById('locStatus');
  if(!navigator.geolocation){ box.innerHTML = '<span style="color:#e8901f;">Tu navegador no soporta ubicación. Escribe la dirección.</span>'; return; }
  box.textContent = 'Obteniendo tu ubicación...';
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      clientLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      box.innerHTML = `<span style="color:#3ac97a;font-weight:600;">✓ Ubicación capturada — <a href="https://www.google.com/maps?q=${clientLocation.lat},${clientLocation.lng}" target="_blank" style="color:#3ac97a;">ver en el mapa</a></span>`;
    },
    ()=>{
      clientLocation = null;
      box.innerHTML = '<span style="color:#e8901f;">No se pudo obtener tu ubicación. Permite el acceso o escribe la dirección.</span>';
    },
    { enableHighAccuracy:true, timeout:10000 }

}

async function sendOrder(){
  const nombre = document.getElementById('nombreInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const addr = document.getElementById('addrInput').value.trim();
  const pagaConVal = document.getElementById('pagaConInput').value;
  const pagaCon = payMethod==='efectivo' && pagaConVal ? Number(pagaConVal) : null;
  const referencia = document.getElementById('referenciaInput').value.trim();
  if(!nombre || !phone){ alert('Completa tu nombre y tu WhatsApp.'); return; }
  if(entrega==='delivery' && !addr){ alert('Escribe la dirección de entrega.'); return; }
  const items = getItems();
  if(items.length===0){ alert('Tu carrito está vacío.'); return; }
  const total = items.reduce((s,i)=>s+i.precio*i.q,0);
  const id = 'ord_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const shortId = Math.floor(1000+Math.random()*9000);
  const order = {
    id, shortId, custName:nombre, phone,
    items: items.map(i=>({id:i.id,nombre:i.nombre,precio:i.precio,cantidad:i.q,emoji:i.emoji})),
    total, deliveryType:entrega, addr: entrega==='delivery'?addr:null,
    location: entrega==='delivery' ? clientLocation : null, pagaCon,
    payMethod, referencia: referencia||null, pagoConfirmado: payMethod==='efectivo',
    comprobante: payMethod==='transferencia' ? comprobanteBase64 : null,
    status:'recibido', rider:null, createdAt: Date.now(), messages: []
  };
  order.messages.push({ text: waMsg(order,'recibido'), at: Date.now() });
  await pushCreateOrder(order);
  myOrderIds.push(id);
  myOrderIds = myOrderIds.slice(-20);
  localStorage.setItem('avenida_mis_pedidos', JSON.stringify(myOrderIds));
  cart = {};
  document.getElementById('nombreInput').value='';
  document.getElementById('phoneInput').value='';
  document.getElementById('addrInput').value='';
  document.getElementById('pagaConInput').value='';
  document.getElementById('referenciaInput').value='';
  document.getElementById('comprobanteInput').value='';
  document.getElementById('comprobantePreview').innerHTML='';
  comprobanteBase64 = null;
  document.getElementById('locStatus').innerHTML='';
  clientLocation = null;
  setPayMethod('efectivo');
  document.getElementById("confirmScreen").classList.remove("show");
  document.getElementById("sentScreen").classList.add("show");
  const notaPago = order.payMethod==='transferencia' ? ' Recuerda hacer la transferencia con los datos que te mostramos si aún no lo has hecho.' : '';
  document.getElementById("sentText").textContent =
    `Gracias, ${nombre}. Tu pedido de ${money(total)} (${entrega==='delivery'?'delivery':'para recoger'}) ya está en el negocio — te confirman en minutos, sin que tengas que llamar ni esperar en línea.${notaPago}`;
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value = 880; g.gain.value = 0.18;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 250);
  }catch(e){}
}

// Crea un mapa chiquito (Leaflet + OpenStreetMap) en cada tarjeta de
// pedido que tenga ubicación — se recrea en cada actualización porque el
// innerHTML de la tarjeta se reconstruye completo cada vez.
function inicializarMapasPedidos(pedidos, prefijo){
  if(typeof L === 'undefined') return;
  prefijo = prefijo || 'mapa_';
  pedidos.forEach(o=>{
    if(!o.location) return;
    const contenedor = document.getElementById(prefijo+o.id);
    if(!contenedor || contenedor.dataset.listo) return;
    contenedor.dataset.listo = '1';
    try{
      const mapa = L.map(contenedor, { zoomControl:false, attributionControl:true }).setView([o.location.lat, o.location.lng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 }).addTo(mapa);
      L.marker([o.location.lat, o.location.lng]).addTo(mapa);
    }catch(e){ console.error('No se pudo cargar el mapa', e); }
  });
}

// Un solo mapa con un pin por cada entrega activa que tenga ubicación,
// para ver de un vistazo dónde está todo (en vez de abrir pedido por pedido).
function inicializarMapaGeneral(pedidosConUbicacion){
  if(typeof L === 'undefined') return;
  const contenedor = document.getElementById('mapaGeneral');
  if(!contenedor || contenedor.dataset.listo) return;
  contenedor.dataset.listo = '1';
  try{
    const mapa = L.map(contenedor, { zoomControl:true, attributionControl:true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 }).addTo(mapa);
    const puntos = pedidosConUbicacion.map(o=>{
      const marcador = L.marker([o.location.lat, o.location.lng]).addTo(mapa);
      marcador.bindPopup(`<b>#${esc(o.shortId)} · ${esc(o.custName)}</b><br>${esc(STATUS_LABEL[o.status]||o.status)} · ${money(o.total)}`);
      return [o.location.lat, o.location.lng];
    });
    if(puntos.length===1){ mapa.setView(puntos[0], 15); }
    else { mapa.fitBounds(puntos, { padding:[24,24] }); }
  }catch(e){ console.error('No se pudo cargar el mapa general', e); }
}

function renderOwnerPedidos(data){
  const el = document.getElementById('ownerScreen');
  const activos = data.orders.filter(o=>o.status!=='entregado'&&o.status!=='cancelado').sort((a,b)=>a.createdAt-b.createdAt);
  // Si nada cambió desde el último refresco, no se reconstruye la pantalla —
  // así el mapa embebido no se recarga y "parpadea" cada 2.5 segundos.
  const snapshot = JSON.stringify(activos) + '|' + showNewOrderFlash + '|' + notifPermiso;
  if(el.dataset.vista==='pedidos' && el.dataset.snapshot===snapshot) return;
  el.dataset.vista='pedidos';
  el.dataset.snapshot=snapshot;
  const tabs = ownerTabsHtml();
  if(activos.length===0){ el.innerHTML = tabs + '<div class="empty">No hay pedidos activos.</div>'; return; }
  const conUbicacion = activos.filter(o=>o.location && o.status!=='entregado');
  const mapaGeneralHtml = conUbicacion.length>0
    ? `<div style="margin-bottom:14px;">
         <div style="font-size:11px;font-weight:700;color:#8a7a67;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;">🗺️ Todas las entregas activas</div>
         <div class="mini-map" id="mapaGeneral" style="height:220px;"></div>
       </div>`

    let accion='';
    if(o.status==='recibido'){
      accion = `<button class="btn-block orange" onclick="advance('${escJs(o.id)}','')">Aceptar y preparar →</button>`;
    } else if(o.status==='preparando'){
      accion = `<button class="btn-block orange" onclick="advance('${escJs(o.id)}','')">Marcar listo →</button>`;
    } else if(o.status==='listo' && o.deliveryType==='delivery'){
      const riderInputId = 'rider_'+o.id;
      accion = `<div class="assign-row"><input class="field-input" style="margin-bottom:0;" type="text" id="${esc(riderInputId)}" placeholder="Nombre del motorista"><button class="btn-block orange" style="width:auto;margin-top:0;padding:10px 14px;" onclick="advance('${escJs(o.id)}', document.getElementById('${escJs(riderInputId)}').value.trim())">Asignar</button></div>`;
    } else if(o.status==='listo'){
      accion = `<button class="btn-block orange" onclick="advance('${escJs(o.id)}','')">Marcar entregado →</button>`;
    } else if(o.status==='en_camino'){
      accion = `<span class="badge en_camino">En camino con ${esc(o.rider)}</span>`;
    }
    const ultimoMsg = o.messages && o.messages.length ? o.messages[o.messages.length-1].text : waMsg(o,'recibido');
    return `<div class="order-card">
      <div class="oid">#${esc(o.shortId)} · ${esc(o.custName)} · ${esc(o.phone)} · ${esc(formatFecha(o.createdAt))}</div>
      <span class="badge ${esc(o.status)}">${esc(STATUS_LABEL[o.status]||o.status)}</span>
      <div style="font-size:11px;color:#6f6153;margin-bottom:6px;">${o.deliveryType==='delivery'?'🛵 Delivery — '+esc(o.addr):'📍 Recoger en el negocio'}</div>
      ${o.location ? `<div class="mini-map" id="mapa_${esc(o.id)}"></div><a class="btn-block" style="background:#3a2f26;margin-top:0;" href="https://www.google.com/maps?q=${Number(o.location.lat)},${Number(o.location.lng)}" target="_blank">🧭 Cómo llegar</a>` : ''}
      ${o.items.map(i=>`<div class="item-line"><span>${esc(i.emoji)} ${esc(i.nombre)} x${Number(i.cantidad)||0}</span><span>${money(i.precio*i.cantidad)}</span></div>`).join('')}
      <div style="font-weight:700;margin:8px 0 0;">Total: ${money(o.total)}</div>
      ${o.pagaCon?`<div class="m-cash">💵 Paga con ${money(o.pagaCon)} → llevar vuelto ${money(vueltoFor(o))}</div>`:''}
      ${o.payMethod==='transferencia' ? (o.pagoConfirmado
        ? `<div class="m-cash">🏦 Transferencia — ✅ pago confirmado${o.referencia?` (ref: ${esc(o.referencia)})`:''}</div>`
        : `<div class="m-cash" style="color:#e8b23a;">🏦 Transferencia — ⏳ pendiente de confirmar${o.referencia?` (ref: ${esc(o.referencia)})`:''}</div>
           <button class="btn-block" style="background:#1a3a24;color:#7fbf6a;" onclick="confirmarPago('${escJs(o.id)}')">✅ Marcar pago recibido</button>`) : ''}
      ${o.comprobanteUrl ? `<a class="btn-block" style="background:#3a2f26;" href="${esc(urlSegura(o.comprobanteUrl))}" target="_blank">🧾 Ver comprobante</a>` : ''}
      ${accion}
      <a class="btn-block wa" href="${esc(waLink(o.phone, ultimoMsg))}" target="_blank">📲 Enviar WhatsApp al cliente</a>
    </div>`;
  }).join('');
  inicializarMapaGeneral(conUbicacion);

}
function renderOwnerIngresos(data){
  const el = document.getElementById('ownerScreen');
  el.dataset.vista='ingresos'; el.dataset.snapshot='';
  const tabs = ownerTabsHtml();
  const entregados = data.orders.filter(o=>o.status==='entregado');

  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const inicioMesTs = new Date(hoy.getFullYear(), hoy.getMonth(), 1).getTime();
  const totalHoy = entregados.filter(o=>o.createdAt>=hoy.getTime()).reduce((s,o)=>s+(o.total||0),0);
  const totalSemana = entregados.filter(o=>o.createdAt>=inicioSemana(hoy)).reduce((s,o)=>s+(o.total||0),0);
  const totalMes = entregados.filter(o=>o.createdAt>=inicioMesTs).reduce((s,o)=>s+(o.total||0),0);
  const totalGeneral = entregados.reduce((s,o)=>s+(o.total||0),0);

  const meses = [...new Set(entregados.map(o=>claveMes(o.createdAt)))].sort().reverse();
  const selMes = document.getElementById('filtroMesIngresos') ? document.getElementById('filtroMesIngresos').value : '';
  const selDia = document.getElementById('filtroDiaIngresos') ? document.getElementById('filtroDiaIngresos').value : '';

  const filtroHtml = `<div class="filters-row">
    <select id="filtroMesIngresos" onchange="renderCurrent()">
      <option value="">Todos los meses</option>
      ${meses.map(m=>`<option value="${m}" ${m===selMes?'selected':''}>${nombreMes(m)}</option>`).join('')}
    </select>
    <input type="date" id="filtroDiaIngresos" value="${selDia}" onchange="renderCurrent()">
    ${(selMes||selDia) ? `<button class="btn-block" style="flex:0;margin-top:0;padding:9px 14px;background:#3a2f26;" onclick="document.getElementById('filtroMesIngresos').value='';document.getElementById('filtroDiaIngresos').value='';renderCurrent()">✕</button>` : ''}
  </div>`;

  let contenido = '';
  if(selDia){
    const delDia = entregados.filter(o=>claveDia(o.createdAt)===selDia);
    const total = delDia.reduce((s,o)=>s+(o.total||0),0);
    contenido = `<div class="order-card">
      <h3 style="margin:2px 0 4px;">${money(total)}</h3>
      <div style="font-size:11.5px;color:#8a7a67;margin-bottom:10px;">${delDia.length} pedido${delDia.length===1?'':'s'} entregado${delDia.length===1?'':'s'} ese día</div>
      ${delDia.map(o=>`<div class="item-line"><span>${esc(o.custName)} · #${esc(o.shortId)}</span><span>${money(o.total)}</span></div>`).join('')}
    </div>`;
  } else {
    const grupos = {};
    entregados.forEach(o=>{
      if(selMes && claveMes(o.createdAt)!==selMes) return;
      const k=claveDia(o.createdAt);
      (grupos[k]=grupos[k]||[]).push(o);
    });
    const dias = Object.keys(grupos).sort().reverse();
    contenido = dias.length===0 ? '' : dias.map(k=>{
      const pedidosDia = grupos[k]; const totalDia = pedidosDia.reduce((s,o)=>s+(o.total||0),0);
      return `<div class="day-card">
        <div class="head"><b>${nombreDia(k)}</b><span>${money(totalDia)}</span></div>
        <div class="sub">${pedidosDia.length} pedido${pedidosDia.length===1?'':'s'}</div>
        ${pedidosDia.map(o=>`<div class="item-line"><span>${esc(o.custName)} · #${esc(o.shortId)}</span><span>${money(o.total)}</span></div>`).join('')}
      </div>`;
    }).join('');
  }
  if(!contenido) contenido = '<div class="empty">No hay ventas entregadas en ese rango.</div>';

  el.innerHTML = tabs + `<div class="stats-grid">
    <div class="stat-box"><div class="num">${money(totalHoy)}</div><div class="lbl">Hoy</div></div>
    <div class="stat-box"><div class="num">${money(totalSemana)}</div><div class="lbl">Esta semana</div></div>
    <div class="stat-box"><div class="num">${money(totalMes)}</div><div class="lbl">Este mes</div></div>
    <div class="stat-box"><div class="num">${money(totalGeneral)}</div><div class="lbl">Histórico</div></div>
  </div>${filtroHtml}${contenido}`;
}
async function confirmarPago(id){
  await pushUpdateOrder(id, { pagoConfirmado: true });
  renderCurrent();
}
async function advance(id, riderVal){
  const data = await fetchData();
  const o = data.orders.find(x=>x.id===id);
  let next;
  if(o.status==='recibido') next='preparando';
  else if(o.status==='preparando') next='listo';
  else if(o.status==='listo') next = o.deliveryType==='delivery' ? 'en_camino' : 'entregado';
  else if(o.status==='en_camino') next='entregado';
  if(!next) return;
  let rider = o.rider;
  if(next==='en_camino'){
    if(!riderVal){ alert('Escribe el nombre del motorista.'); return; }
    rider = riderVal;
  }
  const messages = [...o.messages, { text: waMsg({...o, rider}, next), at: Date.now() }];
  await pushUpdateOrder(id, { status:next, rider, messages });
  renderCurrent();
}

        ${o.items.map(i=>`<div class="item-line"><span>${esc(i.emoji)} ${esc(i.nombre)} x${Number(i.cantidad)||0}</span><span>${money(i.precio*i.cantidad)}</span></div>`).join('')}
        <div style="font-weight:700;margin:8px 0 0;">${money(o.total)}</div>

        <a class="btn-block wa" href="${esc(waLink(o.phone, '¡Voy en camino con tu pedido #'+o.shortId+'! 🛵'))}" target="_blank">📲 Avisar por WhatsApp</a>
        <button class="btn-block orange" onclick="advance('${escJs(o.id)}','')">Marcar entregado</button>
      </div>`).join(''));
  inicializarMapasPedidos(mine, 'mapa_r_');
}

/* ---------- Enrutamiento de roles ---------- */
function setRole(r){
  role = r;
  document.getElementById('btnCliente').classList.toggle('active', r==='cliente'||r==='tracking');
  document.getElementById('btnDueno').classList.toggle('active', r==='owner');
  document.getElementById('btnRepartidor').classList.toggle('active', r==='rider');

  document.getElementById('menuScreen').style.display = r==='cliente' ? 'block' : 'none';
  document.getElementById('confirmScreen').classList.remove('show');
  document.getElementById('sentScreen').classList.remove('show');
  document.getElementById('trackingScreen').classList.toggle('show', r==='tracking');
  document.getElementById('ownerScreen').classList.toggle('show', r==='owner');
  document.getElementById('riderScreen').classList.toggle('show', r==='rider');

  if(r==='cliente'){ cart = {}; renderMenu(); }
  updateCartBar();
  renderCurrent();
}

function hayInputActivoEn(contenedorId){
  const el = document.activeElement;
  const contenedor = document.getElementById(contenedorId);
  return !!(el && contenedor && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') && contenedor.contains(el));
}

async function renderCurrent(){
  const data = await fetchData();
  if(data.menu && data.menu.length){ MENU = data.menu; }
  if(data.cuentas && data.cuentas.length){ CUENTAS_TRANSFERENCIA = data.cuentas; }
  if(role==='owner') checkNewOrders(data);
  if(role==='cliente') renderMenu();
  if(role==='tracking') renderTracking(data);
  if(role==='owner' && !hayInputActivoEn('ownerScreen')) renderOwner(data);
  if(role==='rider' && !hayInputActivoEn('riderScreen')) renderRider(data);
}

// Tiempo real: en vez de esperar a la próxima revisión periódica, Supabase
// avisa al instante cuando algo cambia en pedidos/menú/cuentas (cualquier
// dispositivo conectado), así que la pantalla se actualiza de inmediato.
function iniciarTiempoReal(){
  sb.channel('avenida-cambios')
    .on('postgres_changes', { event:'*', schema:'public', table:'pedidos' }, renderCurrent)
    .on('postgres_changes', { event:'*', schema:'public', table:'menu' }, renderCurrent)
    .on('postgres_changes', { event:'*', schema:'public', table:'cuentas' }, renderCurrent)
    .on('postgres_changes', { event:'*', schema:'public', table:'repartidores' }, renderCurrent)
    .subscribe();
}

// Mantiene duenoAutenticado sincronizado con la sesión real de Supabase Auth
// (persiste entre visitas — no hay que iniciar sesión cada vez).
sb.auth.getSession().then(({ data: { session } }) => {
  duenoAutenticado = !!session;
  if(role==='owner') renderCurrent();
});
sb.auth.onAuthStateChange((_event, session) => {
  duenoAutenticado = !!session;
  if(role==='owner') renderCurrent();
});

setMenuCategoria(menuCategoria);
setEntrega('delivery');
setPayMethod('efectivo');
actualizarFechaHoy();
setInterval(actualizarFechaHoy, 60000);
if(myOrderIds.length>0) setRole('tracking'); else setRole('cliente');
iniciarTiempoReal();
// Revisión de respaldo por si la conexión de tiempo real se cae un momento.
setInterval(renderCurrent, 15000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
